<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Login - Tmam HR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap + Icons -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

</head>

<body class="auth">

<div class="auth-card">
    <div class="d-flex justify-content-center pb-4">
        <img src="img/logo-dark.png" width="80px" alt="Logo">
    </div>
  <h3 class="auth-title text-center">Welcome Back 👋</h3>

  <form id="loginForm">

    <div class="mb-3">
      <input type="email" class="form-control" placeholder="Email" required>
    </div>

    <div class="mb-3">
      <input type="password" class="form-control" placeholder="Password" required>
    </div>

    <div class="d-flex justify-content-between mb-3">
      <div>
        <input type="checkbox"> Remember
      </div>
      <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
    </div>

    <button class="btn btn-primary w-100 auth-btn">
      Login
    </button>

  </form>

</div>

</body>
</html>
