<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="auth">

<div class="auth-card">

  <h3 class="text-center mb-4">Reset Password 🔑</h3>

  <form id="resetForm">

    <input type="password" class="form-control mb-3" placeholder="New Password" required>

    <input type="password" class="form-control mb-3" placeholder="Confirm Password" required>

    <button class="btn btn-primary w-100 auth-btn">
      Reset Password
    </button>

  </form>

</div>

</body>
</html>
